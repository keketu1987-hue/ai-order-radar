name: B-Boss BountyBook executor

on:
  push:
    paths:
      - ".bboss/bountybook-request.json"

permissions:
  contents: write
  id-token: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Call controlled BountyBook bridge
        shell: bash
        env:
          BRIDGE_URL: https://ai-order-radar.netlify.app/api/bountybook-bridge
          OIDC_AUDIENCE: bboss-bountybook-write-v1
        run: |
          set -euo pipefail

          OIDC_TOKEN="$(
            curl -fsS --retry 2               -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"               "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${OIDC_AUDIENCE}"             | jq -er '.value'
          )"

          HTTP_CODE="$(
            curl -sS --retry 2               -o .bboss/bountybook-result.json               -w '%{http_code}'               -H "Authorization: Bearer ${OIDC_TOKEN}"               -H "Content-Type: application/json"               --data-binary @.bboss/bountybook-request.json               "${BRIDGE_URL}"
          )"

          if [ "$HTTP_CODE" -lt 200 ] || [ "$HTTP_CODE" -ge 300 ]; then
            echo "Controlled BountyBook bridge rejected request with HTTP $HTTP_CODE" >&2
            cat .bboss/bountybook-result.json >&2
            exit 1
          fi

      - name: Record sanitized receipt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f .bboss/bountybook-result.json ||             jq -n '{ok:false,error:"EXECUTOR_FAILED_WITHOUT_RECEIPT"}' > .bboss/bountybook-result.json

          git config user.email "keketu1987@gmail.com"
          git config user.name "B-Boss Executor"
          git add .bboss/bountybook-result.json
          git commit -m "chore: record BountyBook action result" || exit 0
          git push
