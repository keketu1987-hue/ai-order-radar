name: B-Boss Frantic executor
on:
  push:
    paths:
      - ".bboss/frantic-request.json"

permissions:
  contents: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Execute Frantic action
        shell: bash
        run: |
          set -euo pipefail
          ACTION=$(jq -r '.action // empty' .bboss/frantic-request.json)

          if [ "$ACTION" = "status" ]; then
            curl -fsS               "https://gofrantic.com/v1/agents/agent-77d7ed/status"               > .bboss/frantic-result.json
          else
            jq -n               --arg action "$ACTION"               '{ok:false,error:"WRITE_BRIDGE_UNAVAILABLE",action:$action,detail:"status path is live; claim/submit require the credentialed bridge"}'               > .bboss/frantic-result.json
          fi

      - name: Record sanitized receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.email "keketu1987@gmail.com"
          git config user.name "B-Boss Executor"
          git add .bboss/frantic-result.json
          git commit -m "chore: record Frantic action result" || exit 0
          git push
