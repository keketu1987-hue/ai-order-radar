name: B-Boss Frantic executor
on:
  push:
    paths:
      - ".bboss/frantic-request.json"

permissions:
  contents: write
  id-token: write

jobs:
  execute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=bboss-frantic-bridge"
          TOKEN=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$URL" | jq -r '.value')
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"
      - name: Execute fixed Frantic action
        shell: bash
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          RESPONSE=$(curl -fsS -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data-binary @.bboss/frantic-request.json \
            "https://ai-order-radar.netlify.app/api/frantic-bridge")
          printf '%s\n' "$RESPONSE" > .bboss/frantic-result.json
      - name: Record sanitized receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.email "keketu1987@gmail.com"
          git config user.name "B-Boss Executor"
          git add .bboss/frantic-result.json
          git commit -m "chore: record Frantic action result" || exit 0
          git push
