name: Frantic shingle one-shot
on:
  push:
    paths:
      - ".github/workflows/frantic-shingle-once.yml"

jobs:
  call:
    runs-on: ubuntu-latest
    steps:
      - name: Open B-Boss-Agent for hire
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            -X POST \
            "https://b84f039c-6996-4ea5-a447-825a37b28033.sandbox.floot.app/_api/frantic-open-shingle"
